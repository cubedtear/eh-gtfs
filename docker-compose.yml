services:
  transit:
    build: .
    image: ${IMAGE_NAME:-euskadi-transit:latest}
    container_name: ${CONTAINER_NAME:-euskadi-transit}
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-8000}:8000"
    volumes:
      - ${DATA_PATH:-transit-data}:/app/data   # imported timetables (SQLite); avoids re-importing on restart
    environment:
      TZ: ${TZ:-Europe/Madrid}

volumes:
  transit-data:
