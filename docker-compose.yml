services:
  transit:
    # Prebuilt image published by .github/workflows/docker.yml. To build from source instead:
    #   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    image: ${IMAGE_NAME:-ghcr.io/josuloo99/eh-gtfs:latest}
    pull_policy: ${PULL_POLICY:-always}
    container_name: ${CONTAINER_NAME:-euskadi-transit}
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-8000}:8000"
    volumes:
      - ${DATA_PATH:-transit-data}:/app/data
    environment:
      TZ: ${TZ:-Europe/Madrid}

volumes:
  transit-data:
